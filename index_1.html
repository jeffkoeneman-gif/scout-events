<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Confirm your attendance</title>
<meta name="description" content="Confirm your attendance for an on-site Scout session.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --paper:#F5F5F5; --surface:#FFFFFF; --sunk:#EDEDED;
  --ink:#0D0D0D; --ink2:#3C3C3C; --muted:#6B6B6B; --line:#E2E2E2; --line2:#C6C6C6;
  --bad:#9E1B1B; --bad-bg:#F2E9E9;
  --r:10px; --rl:16px;
  --c1:#0D0D0D; --c2:#9A9A9A; --c1on:#FFFFFF;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0px) 16px calc(48px + env(safe-area-inset-bottom,0px))}
img{max-width:100%}
[hidden]{display:none!important}
:where(button,input,select,a):focus-visible{outline:2.5px solid var(--c1);outline-offset:2px;border-radius:4px}

.page{max-width:540px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--rl);overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -14px rgba(0,0,0,.28);margin-top:24px}

.hero{background:var(--c1);color:var(--c1on);padding:26px 24px 24px;display:flex;align-items:center;gap:20px;justify-content:space-between}
.herotext{flex:1 1 auto;min-width:0}
.heromark{flex:0 0 auto;display:flex;align-items:center}
.heromark img{height:60px;width:auto;max-width:112px;object-fit:contain;display:block}
.school{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;opacity:.8;display:block;margin-bottom:8px}
.ev{font-family:Archivo,sans-serif;font-weight:900;font-size:25px;letter-spacing:-.03em;line-height:1.08;margin:0 0 8px}
.when{font-size:13.5px;opacity:.88;font-weight:500}
.stripe{height:6px;background:var(--c2)}
@media(max-width:420px){.hero{gap:14px}.heromark img{height:44px;max-width:80px}.ev{font-size:22px}}

.body{padding:24px}
.intro{margin:0 0 20px;color:var(--ink2);font-size:14px}
form{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:480px){.grid2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px}
label{font-size:12.5px;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:6px}
.req{color:var(--bad);font-weight:700}
.opt{font-weight:400;color:var(--muted);font-size:11.5px}
input,select{width:100%;font:400 15px/1.4 "Public Sans",sans-serif;color:var(--ink);background:var(--surface);
  border:1px solid var(--line2);border-radius:var(--r);padding:10px 12px;transition:border-color .13s,box-shadow .13s}
input:focus,select:focus{outline:none;border-color:var(--c1);box-shadow:0 0 0 3px rgba(0,0,0,.08)}
input:disabled{background:var(--sunk);color:var(--ink2)}
input.err,select.err{border-color:var(--bad)}
.errtext{font-size:12px;color:var(--bad);font-weight:500}
.swap{appearance:none;background:none;border:0;padding:2px 0;font:600 12.5px/1 "Public Sans",sans-serif;
  color:var(--muted);cursor:pointer;text-align:left;text-decoration:underline}
.swap:hover{color:var(--ink)}
.submit{background:var(--c1);color:var(--c1on);border:1px solid var(--c1);border-radius:var(--r);
  width:100%;padding:13px;font:700 15px/1 "Public Sans",sans-serif;cursor:pointer;margin-top:4px;transition:opacity .13s}
.submit:hover{opacity:.88}
.submit:disabled{opacity:.45;cursor:not-allowed}
.alert{border-radius:var(--r);padding:12px 14px;font-size:13px;background:var(--bad-bg);color:var(--bad);margin-top:4px}

.foot{padding:16px 24px 20px;border-top:1px solid var(--line);display:flex;align-items:center;
  justify-content:space-between;gap:12px;flex-wrap:wrap}
.by{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.foot img{height:15px;width:auto}

.done{text-align:center;padding:16px 0 8px}
.tick{width:52px;height:52px;border-radius:50%;background:var(--c1);color:var(--c1on);display:flex;
  align-items:center;justify-content:center;margin:0 auto 16px;font-size:26px;font-weight:700}
.done h2{font-family:Archivo,sans-serif;font-weight:900;font-size:22px;letter-spacing:-.03em;margin:0 0 8px}
.done p{margin:0;color:var(--ink2);font-size:14.5px}
.done .sub{color:var(--muted);font-size:13px;margin-top:14px}
.blank{max-width:460px;margin:60px auto;text-align:center;color:var(--muted);
  border:1px dashed var(--line2);border-radius:var(--rl);padding:44px 24px;background:var(--surface)}
.blank h1{font-family:Archivo,sans-serif;font-weight:900;font-size:21px;letter-spacing:-.03em;color:var(--ink);margin:0 0 8px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="page" id="page"></div>

<script>
/* ────────────────────────────────────────────────────────────────
   Scout — on-site attendance

   This page renders ONE event, described entirely by the ?e= value in
   the URL that the admin portal generates. There is no database here and
   nothing to configure per event: a new event is just a new link.

   The only thing to fill in is ENDPOINT, once, after you deploy the
   Apps Script. Until then the form validates and thanks people but
   saves nothing — useful for checking the look, useless for a real session.
   ──────────────────────────────────────────────────────────────── */

   this page needs no setting of its own. ENDPOINT is only a fallback for links

/* ---- helpers ---- */
const $ = s => document.querySelector(s);
const el = (t,a,kids)=>{const n=document.createElement(t);
  for(const k in (a||{})){ if(k==="class")n.className=a[k];
    else if(k==="text")n.textContent=a[k]; else if(k.startsWith("on"))n.addEventListener(k.slice(2),a[k]);
    else if(a[k]!==null&&a[k]!==undefined&&a[k]!==false)n.setAttribute(k,a[k]);}
  (kids||[]).forEach(c=>c&&n.appendChild(typeof c==="string"?document.createTextNode(c):c));
  return n;};
function onColor(hex){
  const h=(hex||"#000").replace("#",""); if(h.length<6) return "#FFFFFF";
  const f=c=>{c/=255;return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4)};
  const L=.2126*f(parseInt(h.slice(0,2),16))+.7152*f(parseInt(h.slice(2,4),16))+.0722*f(parseInt(h.slice(4,6),16));
  return L>0.42?"#111111":"#FFFFFF";
}
function fmtDate(iso){ if(!iso) return ""; const p=iso.split("-").map(Number);
  return new Date(p[0],p[1]-1,p[2]).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"}); }
function fmtTime(t){ if(!t) return ""; const p=t.split(":").map(Number);
  return ((p[0]%12)||12)+":"+String(p[1]).padStart(2,"0")+" "+(p[0]>=12?"PM":"AM"); }
const slug = n => String(n||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60);

/* the admin portal packs the event into the link; unpack it here */
function readEvent(){
  const q = new URLSearchParams(location.search).get("e") ||
            (location.hash.startsWith("#e-") ? location.hash.slice(3) : "");
  if(!q) return null;
  try{
    const b64 = q.replace(/-/g,"+").replace(/_/g,"/");
    const json = decodeURIComponent(escape(atob(b64 + "===".slice((b64.length+3)%4))));
    const o = JSON.parse(json);
    return { name:o.n||"", school:o.s||"", date:o.d||"", time:o.t||"", location:o.l||"",
             intro:o.i||"", c1:o.a||"#0D0D0D", c2:o.b||"#9A9A9A", code:o.c||"",
             api:o.k||"" };
  }catch(e){ return null; }
}

const EVENT = readEvent();
const page = $("#page");

if(!EVENT || !EVENT.name){
  page.appendChild(el("div",{class:"blank"},[
    el("h1",{text:"This link isn’t valid"}),
    el("p",{style:"margin:0",text:"Check with your Scout contact for a current attendance link."})
  ]));
} else {
  render();
}

function render(){
  document.title = EVENT.name + " — Confirm your attendance";
  const root = document.documentElement.style;
  root.setProperty("--c1", EVENT.c1);
  root.setProperty("--c2", EVENT.c2);
  root.setProperty("--c1on", onColor(EVENT.c1));

  const card = el("div",{class:"card"});
  page.appendChild(card);

  /* hero: the event reads first, the school's mark sits to its right */
  const hero = el("div",{class:"hero"});
  const nameTag = el("span",{class:"school",text:EVENT.school});
  const htext = el("div",{class:"herotext"},[nameTag, el("h1",{class:"ev",text:EVENT.name})]);
  const when = [fmtDate(EVENT.date), fmtTime(EVENT.time), EVENT.location].filter(Boolean).join(" · ");
  if(when) htext.appendChild(el("div",{class:"when",text:when}));
  hero.appendChild(htext);

  /* the logo comes from the Apps Script, which reads it out of Drive — nothing
     is stored with this page. Until it answers, the school name holds the spot;
     if it never answers, the name simply stays. */
  if(EVENT.school){
    const holder = el("div",{class:"heromark",hidden:"hidden"});
    const img = el("img",{alt:EVENT.school});
    holder.appendChild(img);
    hero.appendChild(holder);
    loadLogo(EVENT.school, img, holder, nameTag);
  }
  card.appendChild(hero);
  card.appendChild(el("div",{class:"stripe"}));

  const body = el("div",{class:"body",id:"body"});
  card.appendChild(body);
  if(EVENT.intro) body.appendChild(el("p",{class:"intro",text:EVENT.intro}));

  const F = {};
  const mk = (key,label,type,req,extra)=>{
    const id = "a_"+key;
    const inp = el("input",{type:type,id:id,autocomplete:(extra&&extra.ac)||null,
      placeholder:(extra&&extra.ph)||null,inputmode:(extra&&extra.im)||null});
    const err = el("div",{class:"errtext",hidden:"hidden"});
    F[key] = {inp,err,req};
    return el("div",{class:"field"},[
      el("label",{for:id},[label, req?el("span",{class:"req",text:"*"}):el("span",{class:"opt",text:"optional"})]),
      inp, err]);
  };
  const mkSel = (key,label,list,req)=>{
    const id="a_"+key, sel=el("select",{id:id});
    sel.appendChild(el("option",{value:"",text:"Select…"}));
    list.forEach(v=>sel.appendChild(el("option",{value:v,text:v})));
    const err = el("div",{class:"errtext",hidden:"hidden"});
    F[key] = {inp:sel,err,req};
    return el("div",{class:"field"},[
      el("label",{for:id},[label, req?el("span",{class:"req",text:"*"}):null]), sel, err]);
  };

  const schoolInp = el("input",{type:"text",id:"a_school",value:EVENT.school,disabled:"disabled"});
  const schoolErr = el("div",{class:"errtext",hidden:"hidden"});
  F.school = {inp:schoolInp,err:schoolErr,req:true};
  const swap = el("button",{class:"swap",type:"button",onclick:()=>{
    if(schoolInp.disabled){ schoolInp.disabled=false; schoolInp.value=""; schoolInp.focus();
      swap.textContent = "Use "+EVENT.school; }
    else { schoolInp.disabled=true; schoolInp.value=EVENT.school; swap.textContent="Different school?"; }
  }},["Different school?"]);

  const form = el("form",{novalidate:"novalidate"},[
    el("div",{class:"grid2"},[
      mk("firstName","First name","text",true,{ac:"given-name"}),
      mk("lastName","Last name","text",true,{ac:"family-name"})
    ]),
    el("div",{class:"field"},[
      el("label",{for:"a_school"},["School",el("span",{class:"req",text:"*"})]),
      schoolInp, schoolErr, swap
    ]),
    mk("email","School email","email",true,{ac:"email",ph:"you@school.edu",im:"email"}),
    el("div",{class:"grid2"},[mkSel("sport","Sport",SPORTS,true), mkSel("year","Year",YEARS,true)]),
    mkSel("meetingType","Meeting type",MEETING_TYPES,true),
    mk("phone","Phone","tel",false,{ac:"tel",ph:"(555) 123-4567",im:"tel"})
  ]);
  body.appendChild(form);

  const alert = el("div",{class:"alert",hidden:"hidden"});
  body.appendChild(alert);
  const btn = el("button",{class:"submit",type:"submit"},["Confirm my attendance"]);
  form.appendChild(btn);

  card.appendChild(el("div",{class:"foot"},[
    el("span",{class:"by",text:"Powered by Scout"}),
    el("img",{src:SCOUT_MARK,alt:"Scout"})
  ]));

  function validate(){
    let ok=true, first=null;
    for(const k in F){
      const fd=F[k], v=(fd.inp.value||"").trim();
      let msg="";
      if(fd.req && !v) msg="Required.";
      else if(k==="email" && v && !/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(v)) msg="Enter a valid email address.";
      fd.err.textContent=msg; fd.err.hidden=!msg; fd.inp.classList.toggle("err",!!msg);
      if(msg){ ok=false; if(!first) first=fd.inp; }
    }
    if(first) first.focus();
    return ok;
  }
  for(const k in F){
    F[k].inp.addEventListener("input",()=>{
      if(!F[k].err.hidden){ F[k].err.hidden=true; F[k].inp.classList.remove("err"); }
    });
  }

  form.addEventListener("submit", async e=>{
    e.preventDefault();
    alert.hidden = true;
    if(!validate()) return;
    btn.disabled = true; btn.textContent = "Confirming…";

    const rec = {
      firstName:F.firstName.inp.value.trim(), lastName:F.lastName.inp.value.trim(),
      school:F.school.inp.value.trim(),       email:F.email.inp.value.trim(),
      sport:F.sport.inp.value,                year:F.year.inp.value,
      meetingType:F.meetingType.inp.value,    phone:F.phone.inp.value.trim(),
      eventName:EVENT.name, eventDate:EVENT.date, eventTime:EVENT.time,
      eventLocation:EVENT.location, eventCode:EVENT.code,
      submittedAt:new Date().toISOString()
    };

    try{
      if(api()){
        const out = await callService({save:JSON.stringify(rec)}, 60000);
        if(!out || !out.ok) throw new Error((out && out.error) || "refused");
      }
      showDone(rec);
    }catch(err){
      btn.disabled=false; btn.textContent="Confirm my attendance";
      alert.textContent = "That didn’t go through. Check your connection and try once more.";
      alert.hidden = false;
    }
  });
}

/* Every call to the service goes through a script tag rather than fetch.
   A Google web app answers from a redirected address that carries no
   cross-origin headers, so a fetch can send the request but never read the
   reply — which looked exactly like a failure even when the row was saved.
   A script tag has no such rule, and the service names our callback. */
function callService(params, ms){
  const url = api();
  return new Promise((resolve,reject)=>{
    if(!url){ reject(new Error("no service")); return; }
    const cb = "scout_" + Math.random().toString(36).slice(2,10);
    const s  = document.createElement("script");
    let done = false;
    const timer = setTimeout(()=>finish(new Error("timeout")), ms||45000);
    function finish(err,out){
      if(done) return; done = true;
      clearTimeout(timer);
      try{ delete window[cb]; }catch(e){ window[cb] = undefined; }
      if(s.parentNode) s.parentNode.removeChild(s);
      err ? reject(err) : resolve(out);
    }
    window[cb] = out => finish(null,out);
    s.onerror = () => finish(new Error("network"));
    const qs = Object.keys(params)
      .map(k=>encodeURIComponent(k)+"="+encodeURIComponent(params[k])).join("&");
    s.src = url + (url.indexOf("?")<0 ? "?" : "&") + qs + "&cb=" + cb;
    document.head.appendChild(s);
  });
}

/* One small request, cached for the tab, so a second visit is instant.
   The image arrives as data, so nothing on this page links out to Drive. */
async function loadLogo(school, img, holder, nameTag){
  if(!api()) return;
  const key = "scout.logo." + slug(school);
  const show = uri => { img.addEventListener("load",()=>{ holder.hidden=false; nameTag.hidden=true; });
                        img.src = uri; };
  try{ const hit = sessionStorage.getItem(key); if(hit){ show(hit); return; } }catch(e){}
  try{
    const out = await callService({logo:slug(school)}, 20000);
    if(!out || !out.ok || !out.data) return;
    const uri = "data:" + (out.mime || "image/png") + ";base64," + out.data;
    try{ sessionStorage.setItem(key, uri); }catch(e){}
    show(uri);
  }catch(e){ /* no logo, no problem — the school name is already on screen */ }
}

function showDone(r){
  const when = EVENT.date ? " on "+fmtDate(EVENT.date).replace(/^\w+,\s/,"") : "";
  const body = $("#body");
  body.innerHTML = "";
  body.appendChild(el("div",{class:"done"},[
    el("div",{class:"tick",text:"✓"}),
    el("h2",{text:"You’re on the list"}),
    el("p",{text:"Thanks, "+r.firstName+". We’ll see you at "+EVENT.name+when+"."}),
    EVENT.location ? el("p",{class:"sub",text:EVENT.location}) : null,
    el("p",{class:"sub",text:"A confirmation is on file under "+r.email+"."})
  ]));
}
